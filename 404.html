    :root { --ink: #1c1d3a; --muted: #5d607c; --gradient: linear-gradient(100deg, #c026d3, #7c5cff 50%, #60a5fa); }

    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 85% 10%, rgba(96,165,250,.16), transparent 40%), radial-gradient(circle at 10% 90%, rgba(192,38,211,.1), transparent 40%), #fff; color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, sans-serif; text-align: center; }
    main { max-width: 520px; }
    .code { margin: 0; font-size: clamp(6rem, 24vw, 10rem); font-weight: 800; line-height: 1; letter-spacing: -.06em; background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h1 { margin: 12px 0; font-size: 1.8rem; letter-spacing: -.03em; }
    p { color: var(--muted); line-height: 1.6; }
    a { display: inline-flex; margin-top: 18px; padding: 15px 34px; border-radius: 999px; background: var(--gradient); color: #fff; font-weight: 700; text-decoration: none; box-shadow: 0 14px 30px rgba(124,92,255,.3); transition: transform .2s ease; }
    a:hover { transform: translateY(-3px); }
  </style>
</head>
